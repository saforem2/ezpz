# Minimal local-JSONL recipe for Zephon smoke tests.
# Paths are resolved relative to THIS file. Each source points at a
# directory of *.jsonl shards (Zephon requires directory, not file).

text_field = "text"
seed = 42
chunk_size = 4

[[sources]]
name = "a"
path = "./fixtures/shard_a"
fmt = "jsonl"
weight = 1.0

[[sources]]
name = "b"
path = "./fixtures/shard_b"
fmt = "jsonl"
weight = 1.0
